    <header id="topbar">
      <div class="brand">
        <img class="brand-mark" src="images/logo.svg?v=0.0.2" alt="">

      </div>
      <button id="programs" class="btn tool-btn has-icon" type="button" aria-haspopup="menu" aria-expanded="false" data-tip-describes><i data-icon="article"></i><span class="label" data-l10n="bar.programs"></span><i data-icon="keyboard_arrow_down"></i></button>
      <span class="spacer"></span>
      <button id="sound" class="btn icon-only" type="button" aria-pressed="true"><i data-icon="volume_up"></i></button>
      <button id="lang" class="btn tool-btn has-icon lang-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-tip-describes><i data-icon="translate"></i><span class="lang-code"></span><i data-icon="keyboard_arrow_down"></i></button>
      <button id="about" class="btn icon-only" type="button"><i data-icon="info"></i></button>
    </header>

    <main id="stage">
      <nav id="band"></nav>
      <div id="stage-view">
        <div id="view3d"></div>
        <div id="view2d" hidden></div>
      </div>
      <div id="helper-strip"></div>
    </main>

    <div id="dock-handle" role="separator" aria-orientation="horizontal" tabindex="0" data-l10n-tip="dock.resize"></div>
    <section id="dock">
      <div class="dock-bar">
        <div id="dock-tabs" role="tablist">
          <button id="tab-cpu" class="dock-tab" role="tab" aria-controls="pane-cpu" type="button"><i data-icon="memory"></i><span data-l10n="dock.cpu"></span></button>
          <button id="tab-screen" class="dock-tab" role="tab" aria-controls="pane-screen" type="button"><i data-icon="grid_on"></i><span data-l10n="dock.screen"></span></button>
          <button id="tab-keyboard" class="dock-tab" role="tab" aria-controls="pane-keyboard" type="button"><i data-icon="keyboard"></i><span data-l10n="dock.keyboard"></span></button>
          <button id="tab-hanzi" class="dock-tab" role="tab" aria-controls="pane-hanzi" type="button"><i data-icon="font_download"></i><span data-l10n="dock.hanzi"></span></button>
          <button id="tab-start" class="dock-tab" role="tab" aria-controls="pane-start" type="button"><i data-icon="school"></i><span data-l10n="dock.start"></span></button>
          <button id="tab-refs" class="dock-tab" role="tab" aria-controls="pane-refs" type="button"><i data-icon="menu_book"></i><span data-l10n="dock.refs"></span></button>
        </div>
        <span class="spacer"></span>
        <button id="dock-fold" class="btn icon-only" type="button"></button>
      </div>
      <div id="pane-start" class="dock-pane" role="tabpanel" aria-labelledby="tab-start"></div>
      <div id="pane-cpu" class="dock-pane" role="tabpanel" aria-labelledby="tab-cpu" hidden></div>
      <div id="pane-screen" class="dock-pane" role="tabpanel" aria-labelledby="tab-screen" hidden></div>
      <div id="pane-keyboard" class="dock-pane" role="tabpanel" aria-labelledby="tab-keyboard" hidden></div>
      <div id="pane-hanzi" class="dock-pane" role="tabpanel" aria-labelledby="tab-hanzi" hidden></div>
      <div id="pane-refs" class="dock-pane" role="tabpanel" aria-labelledby="tab-refs" hidden></div>
    </section>
