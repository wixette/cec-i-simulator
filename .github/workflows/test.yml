name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # Development only: three.js for Node (tests) and TypeScript's checker. The page
      # uses the copies in vendor/, and nothing is built.
      - run: pnpm install --frozen-lockfile
      # No private references, local paths or broken links (tools/check-refs.mjs).
      - run: pnpm check:refs
      # Every file's licence is declared (REUSE.toml, LICENSES/).
      - uses: fsfe/reuse-action@v6
      # The JSDoc types, checked strictly against the code (tsconfig.json).
      - run: pnpm typecheck
      # The machine on its ROMs, the 6502, the page's logic, the model's contract, vendor/
      # and the import map, and the reference check's own tests. The full 6502 suite is
      # opt-in (pnpm test:6502).
      - run: pnpm test

  # The page itself in a headless Chrome (tests/browser/): clicks, keys, menus, dialogs, the
  # 3D and 2D views, the layout at a phone's width, the lessons, the disk drive, the languages.
  # The runner's Chrome, with its software GPU. Also reports what of the page's code they reach.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser --coverage
